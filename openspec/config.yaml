
schema: spec-driven

context: |
  Project: Gilded Rose Refactoring Kata.

  Technology stack:
  - Language: C#
  - Testing framework: xUnit
  - Platform: .NET

  Scope:
  - Work exclusively within csharp.xUnit.
  - Production code: csharp.xUnit/GildedRose.
  - Tests: csharp.xUnit/GildedRoseTests.

  Project conventions:
  - Follow existing C# conventions.
